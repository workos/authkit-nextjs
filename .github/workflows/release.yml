name: Release

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        description: Token for routing dependency downloads through the WorkOS Socket Firewall.
        required: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Activate Socket Firewall before the pnpm manager action so the
      # package-manager bootstrap is covered too. setup-node below writes
      # registry config for npm publishing, so the firewall is configured
      # again after setup-node.
      - name: Configure Socket Firewall for pnpm manager
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Re-apply after setup-node's registry-url mutation and before the
      # workspace dependency install. This keeps SFW active through
      # `pnpm install` while preserving the npm publish registry config.
      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install Dependencies
        run: pnpm install

      # Restore the public npm registry after the final dependency download and
      # before build and publication. The build (tsc) and publish steps perform
      # no further dependency downloads.
      - name: Restore public package registry
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1

      - name: Build project
        run: pnpm run build

      - name: Publish
        run: pnpm publish --tag latest --access=public --provenance --no-git-checks
