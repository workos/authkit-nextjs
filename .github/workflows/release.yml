name: Release

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        description: Token for routing dependency downloads through the WorkOS Socket Firewall.
        required: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Socket Firewall routes the dependency install below through
      # socket-firewall.workos.dev. setup-node above already wrote the npmjs.org
      # registry config, so SFW must be configured after it and before the first
      # dependency download.
      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install Dependencies
        run: pnpm install

      # Restore the public npm registry after the final dependency download and
      # before build and publication. The build (tsc) and publish steps perform
      # no further dependency downloads.
      - name: Restore public package registry
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1

      - name: Build project
        run: pnpm run build

      - name: Publish
        run: pnpm publish --tag latest --access=public --provenance --no-git-checks
